name: Chore
description: Maintenance. A version update, a rename, a document, or a clean-up.
labels:
  - needs-refinement
body:
  - type: markdown
    attributes:
      value: |
        This issue starts with the `needs-refinement` label. Keep it there until the outcome, scope, evidence, acceptance checks, dependencies, and human actions are clear. Add `agentic` only after a person has resolved any decision, approval, access, or operational step needed for the work. An agent must not guess or expand the scope.
  - type: textarea
    id: task
    attributes:
      label: Outcome and context
      description: What will be true when this is done, and why is it needed?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the change and relevant area. The agent may inspect related files to find the right implementation.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Known files or boundaries
      description: >
        List files already known to be relevant, or name a true boundary. The agent may inspect related files.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and order
      description: List blockers and prerequisites, or write "None".

  - type: textarea
    id: human_actions
    attributes:
      label: Human decision or action needed
      description: State any decision, approval, access, production action, or maintenance window needed. Write "None" when no human action is needed.
      value: None
    validations:
      required: true
