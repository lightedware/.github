name: Feature or improvement
description: New work, or a change to work that exists.
labels:
  - needs-refinement
  - feature
body:
  - type: markdown
    attributes:
      value: |
        This issue starts with the `needs-refinement` label. Keep it there until the outcome, scope, evidence, acceptance checks, dependencies, and human actions are clear. Add `agentic` only after a person has resolved any decision, approval, access, or operational step needed for the work. An agent must not guess or expand the scope.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What must be true after the work? Give the state, and not the steps.
      placeholder: A person who signs in with an expired token gets a clear message.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now? Name the problem that this solves.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What work belongs in this issue? Identify the relevant area; the agent may inspect related code to find the right implementation.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One observable check per line, including how the result can be verified.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and order
      description: List blockers and prerequisites separately from related work. Write "None" when there are no blockers.

  - type: textarea
    id: human_actions
    attributes:
      label: Human decision or action needed
      description: State any decision, approval, access, production action, or maintenance window needed. Write "None" when no human action is needed.
      value: None
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
      description: >
        Name each file and each path that the work must not touch. Name the work that belongs to a
        different issue.

  - type: checkboxes
    id: rules
    attributes:
      label: Before you send this
      options:
        - label: This issue is in the repository that holds the code.
          required: true
