name: CI failure
description: A CI run failed on the default branch, a job is flaky, or a runner failed.
labels:
  - needs-refinement
  - ci-failure
body:
  - type: markdown
    attributes:
      value: |
        This issue starts with the `needs-refinement` label. Keep it there until the outcome, scope, evidence, acceptance checks, dependencies, and human actions are clear. Add `agentic` only after a person has resolved any decision, approval, access, or operational step needed for the work. An agent must not guess or expand the scope.
  - type: markdown
    attributes:
      value: |
        Look for an open issue with the `ci-failure` label first. Add a comment to that issue,
        and do not open a second one.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - CI failure — a run on the default branch, a tag, a release, or a schedule failed
        - Flake — a job failed, and a rerun of the same commit passed
        - Runner error — the job did not start, or the runner stopped
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: The run
      description: The link to the run or to the job.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Branch or tag and commit
      description: Include the commit SHA and the last known passing commit when known.
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: The workflow, the job, and the failed step
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: First useful error and relevant log
      description: The first actionable error and enough surrounding output. Remove each secret value and each token first.
      render: text

  - type: textarea
    id: next_step
    attributes:
      label: Next diagnostic or repair
      description: State the smallest next step to identify or fix the cause. If unknown, say what must be investigated first.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you know
      description: The first error, the last commit that passed, and each rerun.

  - type: textarea
    id: human_actions
    attributes:
      label: Human action needed
      description: Name any host access, rerun, production change, or maintenance window a person must handle. Write "None" if no human action is needed.
      value: None
    validations:
      required: true
